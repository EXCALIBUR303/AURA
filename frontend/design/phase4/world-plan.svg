<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="910" viewBox="0 0 1120 910" role="img" aria-labelledby="title desc">
<title id="title">AURA Phase 4 architectural floor plan, design revision one</title>
<desc id="desc">A twelve by nine metre Project Hub north of an eight by eight metre Atrium. Nine by eight metre Living and Gaming rooms west and east. Three passages each two point four metres wide and two point five metres long. All floors at the same level. Dashed lines mark intended walking routes; circles are optional Astra placement anchors, never four actors. Furniture footprints are design bounds, not finished models.</desc>
